<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <h1 class="title">Nova senha</h1>
      <p class="subtitle">Escolha uma nova senha para sua conta.</p>

      <form id="form-redefinir">
        <div class="input-group">
          <label for="nova-senha">Nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="nova-senha"
                   minlength="6" required
                   placeholder="Mínimo 6 caracteres"
                   autocomplete="new-password">
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="confirmar-senha"
                   minlength="6" required
                   placeholder="Repita a senha"
                   autocomplete="new-password">
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-salvar">
          Salvar nova senha
        </button>
      </form>

      <p id="aviso-redefinir" style="display:none; margin-top:16px;
         padding:12px 16px; border-radius:8px; font-size:14px;"></p>
    </div>
  </div>

  <script src="js/redefinir_senha.js"></script>
</body>
</html>
