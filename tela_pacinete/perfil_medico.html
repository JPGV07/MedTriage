<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Médico - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav" aria-label="Navegação principal">
        <a href="paciente.html">Início</a>
        <a href="tela_paciente/especialistas.html" class="active" aria-current="page">Agendar consulta</a>
        <a href="lados.html">Histórico de laudos</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá</span>
        <button type="button" id="btn-logout" class="btn btn-outline"
                style="padding: 8px 16px; width: auto;">
          Sair
        </button>
      </div>
    </div>
  </header>

  <main class="dashboard-main" id="perfil-publico-container">

    <a href="tela_paciente/especialistas.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Voltar para a busca
    </a>

    <p id="aviso-perfil"
       role="status" aria-live="polite"
       style="display:none; margin-bottom:20px; padding:12px 16px;
              border-radius:8px; font-size:14px;"></p>

    <div class="perfil-medico-card">
      <div class="perfil-medico-avatar" id="perfil-avatar">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="perfil-medico-info">
        <h1 id="pub-nome">Carregando…</h1>
        <p class="especialidade-texto">
          <span id="pub-especialidade">—</span>
          <span id="pub-separador" style="display:none;"> · </span>
          <span id="pub-crm">—</span>
        </p>
        <div class="rating-box" id="pub-rating-box" style="display:none;">
          <span class="rating-estrela">★</span>
          <span class="rating-valor" id="pub-rating">0.0</span>
          <span class="rating-avaliacoes">(<span id="pub-avaliacoes">0</span> opiniões)</span>
        </div>
        <p class="endereco-texto">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               style="vertical-align: middle; margin-right: 4px;">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="pub-endereco">—</span>
        </p>
      </div>
    </div>

    <div class="perfil-secao-card">
      <h2>Sobre o profissional</h2>
      <p id="pub-bio" class="bio-completa">Carregando…</p>
    </div>

    <div class="perfil-secao-card">
      <h2>Valor da consulta</h2>
      <div class="valores-grid">
        <div class="valor-box">
          <p class="valor-label">Consulta presencial</p>
          <p class="valor-preco" id="pub-preco">R$ —</p>
        </div>
      </div>
      <button id="btn-agendar" type="button"
              class="btn btn-primary"
              style="width: auto; padding: 14px 32px; margin-top: 16px;"
              disabled>
        Agendar Consulta
      </button>
    </div>

  </main>

  <script src="js/paciente_js/menu.js"></script>
  <script src="js/tela_medico/perfil_medico_publico.js"></script>
</body>
</html>
