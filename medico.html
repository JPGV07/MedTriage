<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Médico - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #09dfdf 0%, #07ebeb 45%, #04d2e0 100%);
      padding: 25px;
      min-height: 100vh;
    }
    .container { max-width: 1500px; margin: 0 auto; }
    .header {
      background: rgba(12, 24, 28, 0.9);
      backdrop-filter: blur(12px);
      color: white;
      padding: 20px 30px;
      border-radius: 32px 32px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom: none;
    }
    .fila-card {
      background: rgba(12, 18, 28, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 0 0 32px 32px;
      padding: 20px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.1);
      border-top: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #e0e0e0; }
    th { background: rgba(0, 0, 0, 0.5); font-weight: 600; color: #00b7ff; }
    .badge-risco { display: inline-block; padding: 4px 12px; border-radius: 40px; font-weight: 600; font-size: 12px; }
    .vermelho { background: #ef4444; color: white; }
    .amarelo { background: #eab308; color: black; }
    .verde { background: #22c55e; color: white; }
    .btn-chamar {
      background: linear-gradient(135deg, #008cff, #00b7ff);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-chamar:hover { transform: scale(1.02); box-shadow: 0 0 10px rgba(0,140,255,0.5); }
    .btn-sair { background: rgba(255,255,255,0.1); border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; transition: 0.2s; }
    .btn-sair:hover { background: rgba(255,255,255,0.2); }
    .vazio { text-align: center; padding: 40px; color: #aaa; }
    .instrucao { background: rgba(17, 17, 17, 0.4); padding: 10px; border-radius: 28px; margin-top: 20px; text-align: center; font-size: 14px; color: #ccc; }
    .coluna-texto { max-width: 250px; white-space: normal; word-break: break-word; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>👨‍⚕️ Área do Médico - <span id="nomeMedico"></span> (<span id="especialidadeMedico"></span>)</h2>
    <button class="btn-sair" onclick="logout()">Sair</button>
  </div>
  <div class="fila-card"><div id="filaContent"></div></div>
  <div class="instrucao">📢 Ao clicar em "Chamar", o paciente será direcionado ao consultório correspondente à sua especialidade.</div>
</div>

<script>
  let especialidadeAtual = '';
  let consultorioAtual = '';
  let nomeMedicoAtual = '';

  function getConsultorioPorEspecialidade(especialidade) {
    if (especialidade === 'Pediatria') return 'Consultório 1';
    if (especialidade === 'Clínica Geral') return 'Consultório 2';
    if (especialidade === 'Geriatria') return 'Consultório 3';
    return 'Consultório Geral';
  }

  function verificarAcesso() {
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.tipo !== 'medico') { alert('Acesso apenas para médicos.'); window.location.href = 'index.html'; }
    especialidadeAtual = user.especialidade;
    consultorioAtual = getConsultorioPorEspecialidade(especialidadeAtual);
    nomeMedicoAtual = user.nome;
    document.getElementById('nomeMedico').innerHTML = nomeMedicoAtual;
    document.getElementById('especialidadeMedico').innerHTML = `${especialidadeAtual} (${consultorioAtual})`;
  }

  function ordenarFilaRegra(fila) {
    const vermelhos = fila.filter(p => p.risco === 'vermelho');
    const amarelos = fila.filter(p => p.risco === 'amarelo');
    const verdes = fila.filter(p => p.risco === 'verde');
    const resultado = [...vermelhos];
    let i = 0, j = 0;
    while (i < amarelos.length || j < verdes.length) {
      for (let k = 0; k < 3 && i < amarelos.length; k++) resultado.push(amarelos[i++]);
      if (j < verdes.length) resultado.push(verdes[j++]);
    }
    return resultado;
  }

  function carregarFila() {
    let fila = JSON.parse(localStorage.getItem('fila')) || [];
    fila = fila.filter(paciente => paciente.especialidade === especialidadeAtual);
    fila = ordenarFilaRegra(fila);
    const container = document.getElementById('filaContent');
    if (fila.length === 0) { container.innerHTML = '<div class="vazio">📭 Nenhum paciente na fila para sua especialidade.</div>'; return; }
    let html = `<table><thead>`;
    html += `<th>Prioridade</th><th>Paciente</th><th>Gênero</th><th>Especialidade</th><th>Data</th><th>Condições</th><th>Sintomas</th><th>Regra Admin</th><th>Ação</th>`;
    html += `</thead><tbody>`;
    fila.forEach(paciente => {
      const condicoesLista = (paciente.condicoes && paciente.condicoes.length) ? paciente.condicoes.join(', ') : 'Nenhuma';
      const sintomasLista = (paciente.sintomas && paciente.sintomas.length) ? paciente.sintomas.join(', ') : 'Nenhum';
      let regraTexto = '—';
      if (paciente.regrasAdminAtendidas && paciente.regrasAdminAtendidas.length) {
        regraTexto = paciente.regrasAdminAtendidas.join('; ');
        if (regraTexto.length > 60) regraTexto = regraTexto.substring(0, 57) + '...';
      }
      html += `<tr>
        <td><span class="badge-risco ${paciente.risco}">${paciente.risco.toUpperCase()}</span></td>
        <td><strong>${paciente.nome}</strong></td>
        <td>${paciente.genero || 'Não informado'}</td>
        <td>${paciente.especialidade || '—'}</td>
        <td>${new Date(paciente.dataAtendimento).toLocaleDateString('pt-BR')}</td>
        <td class="coluna-texto">${condicoesLista}</td>
        <td class="coluna-texto">${sintomasLista}</td>
        <td style="color: #ffaa88;">${regraTexto}</td>
        <td><button class="btn-chamar" onclick="chamarPaciente('${paciente.cpf}')">✅ Chamar</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function chamarPaciente(cpf) {
    let fila = JSON.parse(localStorage.getItem('fila')) || [];
    const index = fila.findIndex(p => p.cpf === cpf);
    if (index !== -1) {
      const paciente = fila[index];
      if (confirm(`Chamar ${paciente.nome} para ${consultorioAtual}?`)) {
        // Remove da fila
        fila.splice(index, 1);
        localStorage.setItem('fila', JSON.stringify(fila));
        
        // Salva o paciente chamado (dispara evento 'storage' nas outras abas automaticamente)
        localStorage.setItem('pacienteChamado', JSON.stringify({
          nome: paciente.nome,
          risco: paciente.risco,
          consultorio: consultorioAtual,
          especialidade: especialidadeAtual,
          timestamp: new Date().toISOString()
        }));
        
        // Atualiza a lista na tela do médico
        carregarFila();
        alert(`✅ Paciente ${paciente.nome} chamado para ${consultorioAtual}!`);
      }
    } else { 
      alert('Paciente não encontrado na fila.'); 
    }
  }

  function logout() { localStorage.removeItem('user'); window.location.href = 'index.html'; }

  verificarAcesso();
  carregarFila();
  setInterval(carregarFila, 3000);
</script>
</body>
</html>
