<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedTriage - Painel Principal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* RESET e configurações globais */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Fundo gradiente radial com tons escuros e azulados */
      background: radial-gradient(circle at top, #133b5c 0%, #08131d 45%, #000000 100%);
      overflow: hidden;
      padding: 20px;
      position: relative;
    }
    /* Efeitos de glow (brilho) no fundo */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(0, 255, 150, 0.08);
      filter: blur(120px);
      top: -120px;
      right: -100px;
      z-index: 0;
    }
    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: rgba(0, 120, 255, 0.10);
      filter: blur(120px);
      bottom: -150px;
      left: -120px;
      z-index: 0;
    }
    /* Card principal do dashboard com efeito glassmorphism */
    .dashboard {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: rgba(12, 18, 28, 0.82);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px 30px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 180, 255, 0.08);
    }
    /* Logo e animação do coração */
    .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
    .logo-icon { position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; }
    .heart {
      position: relative;
      width: 70px;
      height: 70px;
      background: #ff1e1e;
      transform: rotate(-45deg);
      animation: beat 1.6s infinite;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    }
    /* Cria as duas bolinhas superiores do coração */
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      background: #ff1e1e;
      border-radius: 50%;
    }
    .heart::before { top: -35px; left: 0; }
    .heart::after { left: 35px; top: 0; }
    /* Cruz central (símbolo médico) sobre o coração */
    .cross {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 100px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }
    /* Animação de batimento do coração */
    @keyframes beat {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.08); }
    }
    /* Título com gradiente */
    .title {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #0378ee, #06a1ee, #faf9f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 16px; font-style: italic; color: #e5e5e5; text-align: center; margin-top: 6px; }
    .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); margin: 28px 0; }
    /* Grupo de botões principais */
    .btn-group { display: flex; flex-direction: column; gap: 18px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 22px;
      border-radius: 60px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.25s ease;
      border: 1px solid rgba(255,255,255,0.06);
    }
    /* Botão primário (Paciente) */
    .btn-primary {
      background: linear-gradient(135deg, #008cff, #00b7ff);
      color: white;
      box-shadow: 0 8px 20px rgba(0, 140, 255, 0.28);
    }
    .btn-primary:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 28px rgba(0, 140, 255, 0.4); }
    /* Botões secundários (Médico e Admin) */
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #f1f1f1;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.09); transform: translateY(-3px); }
    .icon { font-size: 24px; }
    footer { margin-top: 32px; text-align: center; font-size: 13px; color: #8aa0ae; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="logo">
      <div class="title">MedTriage</div>
      <div class="logo-icon"><div class="heart"></div><div class="cross">+</div></div>
    </div>
    <div class="subtitle">Cuidando de você em primeiro lugar</div>
    <div class="divider"></div>
    <div class="btn-group">
      <!-- Link para cadastro do paciente -->
      <a href="cadastro.html" class="btn btn-primary"><span class="icon">👤</span>Sou Paciente</a>
      <!-- Link para login do médico (com parâmetro opcional) -->
      <a href="login.html?tipo=medico" class="btn btn-secondary"><span class="icon">👨‍⚕️</span>Área do Médico</a>
      <!-- Link para login do administrador -->
      <a href="login.html?tipo=admin" class="btn btn-secondary"><span class="icon">📊</span>Painel do Admin</a>
    </div>
    <footer>Painel → Cadastro → Aferição → Triagem</footer>
  </div>
</body>
</html>
