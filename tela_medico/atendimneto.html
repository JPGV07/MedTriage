<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento - MedTriage</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav" aria-label="Navegação principal">
        <a href="medico.html">Meus pacientes</a>
        <a href="consultas.html">Ver consultas</a>
        <a href="atendimentos.html">Histórico de atendimentos</a>
        <a href="perfil.html">Meu Perfil</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, Dr(a). [Nome]</span>
        <button id="btn-logout" class="btn btn-outline" style="padding: 8px 16px; width: auto;"
        onclick="window.location.href='tela_profissional/login_profissional.html'">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">

    <a href="medico.html" class="back-link-page" id="back-agenda">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Voltar para a agenda
    </a>

    <div class="welcome-section">
      <h1>Atendimento</h1>
      <p id="atendimento-paciente-info">Carregando…</p>
    </div>

    <p id="aviso-pagina"
       style="display:none; margin-bottom:20px; padding:12px 16px;
              border-radius:8px; font-size:14px;"></p>

    <div class="atendimento-container">

      <div class="atendimento-info-card">
        <div class="atendimento-info-grid">
          <div>
            <label>Paciente</label>
            <p id="atendimento-paciente-nome">—</p>
          </div>
          <div>
            <label>CPF</label>
            <p id="atendimento-paciente-cpf">—</p>
          </div>
          <div>
            <label>Data e horário</label>
            <p id="atendimento-data">—</p>
          </div>
          <div>
            <label>Tipo</label>
            <p id="atendimento-tipo">Consulta presencial</p>
          </div>
          <div>
            <label>Motivo da consulta</label>
            <p id="atendimento-motivo">Não informado</p>
          </div>
        </div>
      </div>

      <div class="atendimento-laudo-card">
        <div class="section-header-flex">
          <h2 class="section-title">Laudo</h2>
          <span id="laudo-status-badge"
                style="display:none; font-size:12px; padding:4px 10px;
                       border-radius:12px; font-weight:600;"></span>
        </div>
        <p class="helper-text" style="margin-bottom: 16px;">
          Escreva o laudo em frases curtas e simples.
        </p>

        <textarea
          id="texto-laudo"
          class="textarea-laudo"
          placeholder="Digite aqui o laudo do atendimento..."
          maxlength="10000"
        ></textarea>

        <p class="helper-text" style="margin-top: 8px;">
          <span id="laudo-contador">0</span> / 10000 caracteres
        </p>

        <div class="atendimento-acoes">
          <button id="btn-finalizar" class="btn btn-primary" style="width: auto;" disabled>
            Finalizar atendimento
          </button>
          <button id="btn-rascunho" class="btn btn-outline" style="width: auto;" disabled>
            Salvar rascunho
          </button>
          <a href="medico.html" class="btn btn-outline"
             style="width: auto; border: none; color: var(--text-muted);" id="btn-cancelar">
            Cancelar
          </a>
        </div>
      </div>

    </div>

  </main>

  <script src="js/medico_js/perfil.js"></script>
</body>
</html>
