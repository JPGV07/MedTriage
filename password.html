<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Voltar para o login
      </a>

      <h1 class="title">Recuperar senha</h1>
      <p class="subtitle" id="subtitulo-recuperacao">
        Informe o e-mail cadastrado na sua conta. Enviaremos um código de
        6 dígitos para confirmar sua identidade.
      </p>

      <form id="recuperar-form" novalidate>

        <div class="input-group">
          <label for="input-recuperar-email">E-mail cadastrado</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="input-recuperar-email"
              placeholder="voce@exemplo.com"
              required
              autocomplete="email"
              inputmode="email"
            >
          </div>
          <span class="helper-text">
            Funciona para pacientes e médicos.
          </span>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-enviar">
          Enviar código de verificação
        </button>

      </form>

      <p
        id="aviso-recuperar"
        role="status"
        aria-live="polite"
        style="display:none; margin-top:16px; padding:12px 16px;
               border-radius:8px; font-size:14px; line-height:1.5;"
      ></p>

      <p class="help-text">
        Precisa de ajuda? Ligue [TELEFONE]
      </p>

    </div>
  </div>

  <script src="js/password.js"></script>

</body>
</html>
