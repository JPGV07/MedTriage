<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #133b5c 0%, #08131d 45%, #000000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      background: rgba(12, 18, 28, 0.9);
      backdrop-filter: blur(18px);
      border-radius: 40px;
      padding: 40px 32px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header h2 {
      font-size: 28px;
      background: linear-gradient(90deg, #0b8dff, #00b4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #ccc; }
    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      font-size: 16px;
      color: white;
    }
    input:focus { border-color: #00b7ff; outline: none; background: rgba(0,0,0,0.6); }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #008cff, #00b7ff);
      color: white;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,140,255,0.3); }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #8aa0ae; text-decoration: none; }
    .error-msg { background: rgba(220,38,38,0.2); color: #ff8888; padding: 12px; border-radius: 28px; text-align: center; margin-top: 16px; display: none; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header"><h2> Acesso</h2><p style="color:#aaa;">Médico (Igor, Eduarda, Wilson) ou Administrador (João)</p></div>
  <div class="input-group"><label>👤 Usuário</label><input type="text" id="username" placeholder="Ex: Igor, Eduarda, Wilson, João ou medico/pediatra/geriatra/admin" autocomplete="off"></div>
  <div class="input-group"><label>🔒 Senha</label><input type="password" id="password" placeholder="••••••"></div>
  <button class="btn-login" onclick="fazerLogin()">Entrar →</button>
  <a href="index.html" class="back-link">← Voltar ao Painel</a>
  <div id="errorMsg" class="error-msg"></div>
</div>
<script>
  function fazerLogin() {
    let user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.style.display = 'none';
    
    if (!user || !pass) { 
      errorDiv.innerText = 'Preencha usuário e senha'; 
      errorDiv.style.display = 'block'; 
      return; 
    }
    
    // Mapeamento de nomes pessoais para usuários internos
    let usuarioInterno = user.toLowerCase();
    if (usuarioInterno === 'joão' || usuarioInterno === 'joao') usuarioInterno = 'admin';
    else if (usuarioInterno === 'igor') usuarioInterno = 'medico';
    else if (usuarioInterno === 'eduarda') usuarioInterno = 'pediatra';
    else if (usuarioInterno === 'wilson') usuarioInterno = 'geriatra';
    
    // ADMIN
    if (usuarioInterno === 'admin' && pass === 'admin') {
      localStorage.setItem('user', JSON.stringify({ tipo: 'admin', nome: 'João', especialidade: 'Administrador' }));
      window.location.href = 'admin.html';
      return;
    }
    
    // Médicos (senha padrão 123)
    if (pass !== '123') { 
      errorDiv.innerText = 'Senha incorreta. Use 123 para médicos.'; 
      errorDiv.style.display = 'block'; 
      return; 
    }
    
    let especialidade = '', nomeMedico = '';
    if (usuarioInterno === 'medico') { especialidade = 'Clínica Geral'; nomeMedico = 'Igor'; }
    else if (usuarioInterno === 'pediatra') { especialidade = 'Pediatria'; nomeMedico = 'Eduarda'; }
    else if (usuarioInterno === 'geriatra') { especialidade = 'Geriatria'; nomeMedico = 'Wilson'; }
    else { 
      errorDiv.innerText = 'Usuário inválido. Use: Igor, Eduarda, Wilson, João ou medico/pediatra/geriatra/admin'; 
      errorDiv.style.display = 'block'; 
      return; 
    }
    
    localStorage.setItem('user', JSON.stringify({ tipo: 'medico', especialidade, nome: nomeMedico }));
    window.location.href = 'medico.html';
  }
  
  document.getElementById('password').addEventListener('keypress', (e) => { 
    if (e.key === 'Enter') fazerLogin(); 
  });
</script>
</body>
</html>
