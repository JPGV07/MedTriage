<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar código - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <a href="password.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Voltar
      </a>

      <h1 class="title">Verifique seu e-mail</h1>
      <p class="subtitle" id="subtitulo-codigo">
        Enviamos um código de 6 dígitos para o seu e-mail.
      </p>

      <form id="form-codigo">
        <div class="input-group">
          <label for="input-codigo">Código de verificação</label>
          <div class="input-wrapper">
            <input type="text" id="input-codigo"
                   placeholder="000000" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code"
                   pattern="\d{6}" required
                   style="letter-spacing: 8px; font-size: 22px; text-align: center;">
          </div>
          <span class="helper-text" id="helper-codigo">
            O código expira em 10 minutos.
          </span>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-validar">
          Validar código
        </button>
      </form>

      <div class="first-time-box" style="margin-top:24px;">
        <p id="msg-reenvio">Não recebeu o código?</p>
        <button type="button" id="btn-reenviar" class="btn btn-outline"
                style="width:auto; margin-top:8px;" disabled>
          Reenviar em <span id="contador-reenvio">60</span>s
        </button>
      </div>

      <p id="aviso-codigo" style="display:none; margin-top:16px;
         padding:12px 16px; border-radius:8px; font-size:14px;"></p>
    </div>
  </div>

  <script src="js/verificar_codigo.js"></script>
</body>
</html>
