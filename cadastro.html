<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #133b5c 0%, #08131d 45%, #000000 100%);
      padding: 20px;
      position: relative;
    }
    body::before, body::after { content: ""; position: absolute; width: 500px; height: 500px; filter: blur(120px); z-index: 0; }
    body::before { background: rgba(0,255,150,0.08); top: -120px; right: -100px; }
    body::after { background: rgba(0,120,255,0.10); bottom: -150px; left: -120px; }
    .container {
      position: relative;
      z-index: 1;
      max-width: 750px;
      width: 100%;
      background: rgba(12,18,28,0.82);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 20px rgba(0,180,255,0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg,#008cff,#00b7ff);
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
    .header p { opacity: 0.9; margin-top: 0.5rem; }
    .form-container { padding: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      color: #e0e0e0;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(239,243,243,0.877);
      border: 1px solid rgba(245,238,238,0.918);
      border-radius: 28px;
      font-size: 1rem;
      color: rgb(10,10,10);
      transition: 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #00b7ff;
      background: rgba(236,233,233,0.918);
    }
    .idade-opcoes {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 8px;
    }
    .idade-card {
      flex: 1;
      min-width: 140px;
      background: rgba(5,211,238,0.918);
      border: 1px solid rgba(16,173,221,0.89);
      border-radius: 28px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      color: #ddd;
    }
    .idade-card.selected {
      background: linear-gradient(135deg,#1202ec,#0b07f8);
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 20px rgba(8,4,245,0.945);
    }
    .idade-emoji { font-size: 2rem; }
    .idade-titulo { font-weight: 700; margin: 8px 0 4px; }
    .idade-desc { font-size: 12px; opacity: 0.8; }
    .genero-opcoes {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .genero-opcoes label {
      background: rgba(255,255,255,0.1);
      padding: 10px 18px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: normal;
      color: #ddd;
      transition: 0.2s;
    }
    .genero-opcoes input {
      display: none;
    }
    .genero-opcoes label.selected {
      background: linear-gradient(135deg,#008cff,#00b7ff);
      color: white;
      box-shadow: 0 0 10px rgba(0,140,255,0.5);
    }
    .condicoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .condicoes-grid label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: normal;
      font-size: 14px;
      transition: 0.2s;
    }
    .condicoes-grid label.disabled {
      opacity: 0.4;
      background: #2c2c2c;
      cursor: not-allowed;
      pointer-events: none;
    }
    .condicoes-grid input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: #ddd;
    }
    .checkbox-group input { width: auto; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg,#008cff,#00b7ff);
      box-shadow: 0 8px 20px rgba(0,140,255,0.25);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,140,255,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      box-shadow: none;
      margin-top: 1rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    small { color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📝 Cadastro do Paciente</h1>
    <p>Preencha seus dados para iniciar a aferição</p>
  </div>
  <div class="form-container">
    <form id="cadastroForm">
      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" id="nome" required oninput="this.value = this.value.replace(/[^a-zA-ZÀ-ÿ ]/g,'')">
      </div>
      <div class="form-group">
        <label>Faixa Etária *</label>
        <div class="idade-opcoes" id="idadeOpcoes">
          <div class="idade-card" data-faixa="0-17" data-especialidade="Pediatria">
            <div class="idade-emoji">👶</div>
            <div class="idade-titulo">0 a 17 anos</div>
            <div class="idade-desc">Pediatria</div>
          </div>
          <div class="idade-card" data-faixa="18-59" data-especialidade="Clínica Geral">
            <div class="idade-emoji">🧑</div>
            <div class="idade-titulo">18 a 59 anos</div>
            <div class="idade-desc">Clínica Geral</div>
          </div>
          <div class="idade-card" data-faixa="60+" data-especialidade="Geriatria">
            <div class="idade-emoji">👴</div>
            <div class="idade-titulo">60 anos ou mais</div>
            <div class="idade-desc">Geriatria</div>
          </div>
        </div>
        <input type="hidden" id="faixaEtaria" required>
        <input type="hidden" id="especialidade">
      </div>
      <div class="form-group">
        <label>Gênero *</label>
        <div class="genero-opcoes" id="generoOpcoes">
          <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
          <label><input type="radio" name="genero" value="Feminino"> Feminino</label>
          <label><input type="radio" name="genero" value="Homens Trans"> Homens Trans</label>
          <label><input type="radio" name="genero" value="Mulher Trans"> Mulher Trans</label>
          <label><input type="radio" name="genero" value="Não Binário"> Não Binário</label>
        </div>
      </div>
      <div class="form-group">
        <label>Condições de Saúde (Opcional)</label>
        <div class="condicoes-grid" id="condicoesGrid">
          <label><input type="checkbox" class="condicao" value="Gravidez" data-peso="30"> 🤰 Gravidez</label>
          <label><input type="checkbox" class="condicao" value="HIV" data-peso="40"> 🦠 HIV</label>
          <label><input type="checkbox" class="condicao" value="Doença Mental" data-peso="20"> 🧠 Doença Mental</label>
          <label><input type="checkbox" class="condicao" value="Diabetes" data-peso="25"> 🍬 Diabetes</label>
          <label><input type="checkbox" class="condicao" value="Hipertensão" data-peso="30"> ❤️ Hipertensão</label>
          <label><input type="checkbox" class="condicao" value="Obesidade Mórbida" data-peso="20"> 🍔 Obesidade Mórbida</label>
          <label><input type="checkbox" class="condicao" value="Asma Grave" data-peso="35"> 🌬️ Asma Grave</label>
          <label><input type="checkbox" class="condicao" value="Insuficiência Cardíaca" data-peso="50"> 💔 Insuficiência Cardíaca</label>
          <label><input type="checkbox" class="condicao" value="Doença Renal Crônica" data-peso="45"> 🩺 Doença Renal Crônica</label>
          <label><input type="checkbox" class="condicao" value="Câncer em Tratamento" data-peso="60"> 🎗️ Câncer em Tratamento</label>
          <label><input type="checkbox" class="condicao" value="Tuberculose Ativa" data-peso="55"> 🦠 Tuberculose Ativa</label>
          <label><input type="checkbox" class="condicao" value="Hepatite Crônica" data-peso="30"> 🧪 Hepatite Crônica</label>
          <label><input type="checkbox" class="condicao" value="Imunossupressão" data-peso="40"> 🛡️ Imunossupressão</label>
          <label><input type="checkbox" class="condicao" value="DPOC" data-peso="35"> 💨 DPOC(Doença Pulmonar Obstrutiva Crônica)</label>
        </div>
      </div>
      <div class="form-group">
  <label>Telefone *</label>
  <input
    type="text"
    id="telefone"
    placeholder="(DD)12345678"
    required
    maxlength="12"
  >
  <small id="telefoneErro" style="color:#ff6b6b; display:none;">
    Informe um telefone válido no formato (83)12345678
  </small>
</div>
      <div class="form-group">
        <label>CPF *</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
        <small>Obrigatório apenas para brasileiros</small>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="estrangeiro">
        <label for="estrangeiro">🌍 Sou estrangeiro</label>
      </div>
      <div class="form-group">
        <label>Email (Opcional)</label>
        <input type="email" id="email">
      </div>
      <button type="submit" class="btn btn-primary">Iniciar Aferição →</button>
    </form>
    <button class="btn btn-secondary" onclick="location.href='index.html'">← Voltar ao Painel</button>
  </div>
</div>

<script>
  // Aguarda o DOM carregar completamente
  document.addEventListener('DOMContentLoaded', function() {
    const telefoneInput = document.getElementById('telefone');
const telefoneErro = document.getElementById('telefoneErro');

// Máscara automática
telefoneInput.addEventListener('input', function (e) {

  let valor = e.target.value.replace(/\D/g, '');

  // Limita a 10 dígitos (DDD + telefone)
  valor = valor.substring(0, 10);

  if (valor.length >= 2) {
    valor = '(' + valor.substring(0, 2) + ')' + valor.substring(2);
  }

  e.target.value = valor;

  validarTelefone();
});

function validarTelefone() {

  const telefone = telefoneInput.value;

  // Formato obrigatório: (83)12345678
  const regex = /^\(\d{2}\)\d{8}$/;

  if (telefone === '') {
    telefoneErro.style.display = 'none';
    return false;
  }

  if (!regex.test(telefone)) {
    telefoneErro.style.display = 'block';
    telefoneInput.style.borderColor = '#ff4d4d';
    return false;
  }

  telefoneErro.style.display = 'none';
  telefoneInput.style.borderColor = '';
  return true;
}
    // Seleção de faixa etária
    const cards = document.querySelectorAll('.idade-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('faixaEtaria').value = card.dataset.faixa;
        document.getElementById('especialidade').value = card.dataset.especialidade;
      });
    });

    // Elementos da trava de gravidez
    const generoRadios = document.querySelectorAll('input[name="genero"]');
    const gravidezCheckbox = document.querySelector('.condicao[value="Gravidez"]');
    const gravidezLabel = gravidezCheckbox.closest('label'); // pega o label pai

    function atualizarTravaGravidez() {
      let generoSelecionado = null;
      for (let radio of generoRadios) {
        if (radio.checked) {
          generoSelecionado = radio.value;
          break;
        }
      }
      if (!generoSelecionado) {
        // Nenhum gênero selecionado: deixa habilitado (comportamento padrão)
        if (gravidezCheckbox) {
          gravidezCheckbox.disabled = false;
          gravidezLabel.classList.remove('disabled');
        }
        return;
      }
      // Desabilita para masculino cis e mulher trans
      if (generoSelecionado === 'Masculino' || generoSelecionado === 'Mulher Trans') {
        gravidezCheckbox.disabled = true;
        gravidezCheckbox.checked = false;
        gravidezLabel.classList.add('disabled');
      } else {
        gravidezCheckbox.disabled = false;
        gravidezLabel.classList.remove('disabled');
      }
    }

    // Adiciona evento de change para cada rádio de gênero
    generoRadios.forEach(radio => {
      radio.addEventListener('change', function() {
        // Atualiza a aparência dos labels de gênero
        const allLabels = document.querySelectorAll('#generoOpcoes label');
        allLabels.forEach(label => label.classList.remove('selected'));
        if (this.checked) {
          this.parentElement.classList.add('selected');
        }
        atualizarTravaGravidez();
      });
    });

    // Executa a trava ao carregar (caso algum rádio já esteja marcado)
    atualizarTravaGravidez();

    // CPF e estrangeiro
    const cpfInput = document.getElementById('cpf');
    const estrangeiroCheck = document.getElementById('estrangeiro');
    function toggleCpfRequired() {
      if (estrangeiroCheck.checked) {
        cpfInput.removeAttribute('required');
        cpfInput.placeholder = 'CPF opcional';
      } else {
        cpfInput.setAttribute('required', 'required');
        cpfInput.placeholder = '000.000.000-00';
      }
    }
    estrangeiroCheck.addEventListener('change', toggleCpfRequired);
    toggleCpfRequired();

    cpfInput.addEventListener('input', function(e) {
      let val = e.target.value.replace(/\D/g, '');
      if (val.length > 3) val = val.replace(/^(\d{3})(\d)/, '$1.$2');
      if (val.length > 6) val = val.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
      if (val.length > 9) val = val.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
      e.target.value = val.substring(0, 14);
    });

    // Submissão do formulário
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const faixa = document.getElementById('faixaEtaria').value;
      const especialidade = document.getElementById('especialidade').value;
      if (!nome || !faixa) { alert('Preencha nome e selecione a faixa etária.'); return; }
      const generoSelecionado = document.querySelector('input[name="genero"]:checked');
      if (!generoSelecionado) { alert('Selecione o gênero.'); return; }
      const genero = generoSelecionado.value;
      const telefone = document.getElementById('telefone').value;
      let cpf = document.getElementById('cpf').value;
      const estrangeiro = estrangeiroCheck.checked;
      if (!estrangeiro && !cpf) { alert('CPF é obrigatório para brasileiros.'); return; }
      const condicoes = [];
      let pesoCondicoes = 0;
      document.querySelectorAll('.condicao:checked').forEach(cb => {
        condicoes.push(cb.value);
        pesoCondicoes += parseInt(cb.dataset.peso);
      });
      const paciente = {
        nome, faixaEtaria: faixa, especialidade, genero,
        condicoes, pesoCondicoes,
        telefone, cpf: estrangeiro ? (cpf || 'Estrangeiro') : cpf,
        email: document.getElementById('email').value,
        estrangeiro, dataCadastro: new Date().toISOString()
      };
      localStorage.setItem('pacienteData', JSON.stringify(paciente));
      window.location.href = 'afericao.html';
    });
  });
</script>
</body>
</html>
