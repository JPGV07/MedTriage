<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body>
<div class="container">
  <!-- Cabeçalho azul com título -->
  <div class="header">
    <h1>📝 Cadastro do Paciente</h1>
    <p>Preencha seus dados para iniciar a aferição</p>
  </div>

  <div class="form-container">
    <form id="cadastroForm">
      <!-- Nome: aceita apenas letras e espaços (validação em tempo real) -->
      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" id="nome" required
               oninput="this.value = this.value.replace(/[^a-zA-ZÀ-ÿ ]/g,'')">
      </div>

      <!-- Faixa etária: cards clicáveis (guardam dados em inputs hidden) -->
      <div class="form-group">
        <label>Faixa Etária *</label>
        <div class="idade-opcoes" id="idadeOpcoes">
          <div class="idade-card" data-faixa="0-17" data-especialidade="Pediatria">
            <div class="idade-emoji">👶</div>
            <div class="idade-titulo">0 a 17 anos</div>
            <div class="idade-desc">Pediatria</div>
          </div>
          <div class="idade-card" data-faixa="18-59" data-especialidade="Clínica Geral">
            <div class="idade-emoji">🧑</div>
            <div class="idade-titulo">18 a 59 anos</div>
            <div class="idade-desc">Clínica Geral</div>
          </div>
          <div class="idade-card" data-faixa="60+" data-especialidade="Geriatria">
            <div class="idade-emoji">👴</div>
            <div class="idade-titulo">60 anos ou mais</div>
            <div class="idade-desc">Geriatria</div>
          </div>
        </div>
        <!-- Inputs escondidos preenchidos via JS ao clicar num card -->
        <input type="hidden" id="faixaEtaria" required>
        <input type="hidden" id="especialidade">
      </div>

      <!-- Gênero: radios estilizados como pílulas -->
      <div class="form-group">
        <label>Gênero *</label>
        <div class="genero-opcoes" id="generoOpcoes">
          <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
          <label><input type="radio" name="genero" value="Feminino"> Feminino</label>
          <label><input type="radio" name="genero" value="Homens Trans"> Homens Trans</label>
          <label><input type="radio" name="genero" value="Mulher Trans"> Mulher Trans</label>
          <label><input type="radio" name="genero" value="Não Binário"> Não Binário</label>
        </div>
      </div>

      <!-- Condições: cada checkbox tem data-peso usado na triagem -->
      <div class="form-group">
        <label>Condições de Saúde (Opcional)</label>
        <div class="condicoes-grid" id="condicoesGrid">
          <label><input type="checkbox" class="condicao" value="Gravidez" data-peso="30"> 🤰 Gravidez</label>
          <label><input type="checkbox" class="condicao" value="HIV" data-peso="40"> 🦠 HIV</label>
          <label><input type="checkbox" class="condicao" value="Doença Mental" data-peso="20"> 🧠 Doença Mental</label>
          <label><input type="checkbox" class="condicao" value="Diabetes" data-peso="25"> 🍬 Diabetes</label>
          <label><input type="checkbox" class="condicao" value="Hipertensão" data-peso="30"> ❤️ Hipertensão</label>
          <label><input type="checkbox" class="condicao" value="Obesidade Mórbida" data-peso="20"> 🍔 Obesidade Mórbida</label>
          <label><input type="checkbox" class="condicao" value="Asma Grave" data-peso="35"> 🌬️ Asma Grave</label>
          <label><input type="checkbox" class="condicao" value="Insuficiência Cardíaca" data-peso="50"> 💔 Insuficiência Cardíaca</label>
          <label><input type="checkbox" class="condicao" value="Doença Renal Crônica" data-peso="45"> 🩺 Doença Renal Crônica</label>
          <label><input type="checkbox" class="condicao" value="Câncer em Tratamento" data-peso="60"> 🎗️ Câncer em Tratamento</label>
          <label><input type="checkbox" class="condicao" value="Tuberculose Ativa" data-peso="55"> 🦠 Tuberculose Ativa</label>
          <label><input type="checkbox" class="condicao" value="Hepatite Crônica" data-peso="30"> 🧪 Hepatite Crônica</label>
          <label><input type="checkbox" class="condicao" value="Imunossupressão" data-peso="40"> 🛡️ Imunossupressão</label>
          <label><input type="checkbox" class="condicao" value="DPOC" data-peso="35"> 💨 DPOC (Doença Pulmonar Obstrutiva Crônica)</label>
        </div>
      </div>

      <!-- Telefone com máscara automática e validação -->
      <div class="form-group">
        <label>Telefone *</label>
        <input type="text" id="telefone" placeholder="(DD)12345678" required maxlength="14">
        <small id="telefoneErro" style="color:#ff6b6b; display:none;">
          Informe um telefone válido no formato (83)12345678
        </small>
      </div>

      <!-- CPF: obrigatório para brasileiros, opcional para estrangeiros -->
      <div class="form-group">
        <label>CPF *</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
        <small>Obrigatório apenas para brasileiros</small>
      </div>

      <!-- Checkbox que desativa a obrigatoriedade do CPF -->
      <div class="checkbox-group">
        <input type="checkbox" id="estrangeiro">
        <label for="estrangeiro">🌍 Sou estrangeiro</label>
      </div>

      <!-- Email opcional -->
      <div class="form-group">
        <label>Email (Opcional)</label>
        <input type="email" id="email">
      </div>

      <button type="submit" class="btn btn-primary">Iniciar Aferição →</button>
    </form>

    <!-- Voltar ao painel principal -->
    <button class="btn btn-secondary" onclick="location.href='index.html'">← Voltar ao Painel</button>
  </div>
</div>

<!-- Scripts: core (Storage/Auth/Utils) + lógica específica da página -->
<script src="js/core.js"></script>
<script src="js/pages/cadastro.js"></script>
</body>
</html>
