<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div class="login-card">
  <!-- Cabeçalho com dica de usuários -->
  <div class="login-header">
    <h2>Acesso</h2>
    <p style="color:#aaa;">Médico (Igor, Eduarda, Wilson) ou Administrador (João)</p>
  </div>

  <!-- Campos de login -->
  <div class="input-group">
    <label>👤 Usuário</label>
    <input type="text" id="username"
           placeholder="Ex: Igor, Eduarda, Wilson, João ou medico/pediatra/geriatra/admin"
           autocomplete="off">
  </div>
  <div class="input-group">
    <label>🔒 Senha</label>
    <input type="password" id="password" placeholder="••••••">
  </div>

  <button class="btn-login" onclick="fazerLogin()">Entrar →</button>
  <a href="index.html" class="back-link">← Voltar ao Painel</a>

  <!-- Área de erro (só aparece se algo der errado) -->
  <div id="errorMsg" class="error-msg"></div>
</div>

<script src="js/core.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
