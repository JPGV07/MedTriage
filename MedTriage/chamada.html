<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Chamada - MedTriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #05d1ec 0%, #04dbd1 45%, #07ebc5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    /* Painel central de chamada */
    .painel {
      max-width: 800px;
      width: 100%;
      background: rgba(12, 18, 28, 0.9);
      backdrop-filter: blur(18px);
      border-radius: 60px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 20px rgba(0,180,255,0.1);
      border: 1px solid rgba(232, 238, 232, 0.1);
      transition: all 0.3s;
    }
    .titulo { font-size: 2rem; font-weight: 700; background: linear-gradient(90deg, #0b8dff, #00b4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
    .paciente-nome { font-size: 3.5rem; font-weight: 800; margin: 30px 0; word-break: break-word; color: white; }
    .prioridade-badge { display: inline-block; padding: 15px 40px; border-radius: 80px; font-weight: 800; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
    .consultorio-info { margin-top: 30px; font-size: 2rem; font-weight: 700; background: rgba(0,0,0,0.5); display: inline-block; padding: 15px 30px; border-radius: 60px; color: #ffd966; }
    .mensagem-aviso { margin-top: 40px; font-size: 1.4rem; font-weight: 500; color: #ccc; }
    .aguardando { color: #aaa; font-size: 1.8rem; font-weight: 500; }
    /* Cores dos badges de prioridade */
    .vermelho-bg { background: #ef4444; color: white; }
    .amarelo-bg { background: #eab308; color: black; }
    .verde-bg { background: #22c55e; color: white; }
    footer { margin-top: 40px; font-size: 0.9rem; color: #8aa0ae; }
    /* Animação de piscar quando um paciente é chamado */
    @keyframes pisca { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.01); } 100% { opacity: 1; transform: scale(1); } }
    .chamado { animation: pisca 1s infinite; }
  </style>
</head>
<body>
<div class="painel" id="painel">
  <div class="titulo">📢 PRÓXIMO PACIENTE</div>
  <div id="conteudo"><div class="aguardando">Aguardando chamada...</div></div>
  <footer>Fique atento ao seu nome, cor de prioridade e ao consultório indicado.</footer>
</div>

<script>
  // =================== ATUALIZA A TELA COM O PACIENTE CHAMADO ===================
  function atualizarDisplay() {
    // Recupera os dados do paciente que foi chamado (salvo pelo médico)
    const chamado = JSON.parse(localStorage.getItem('pacienteChamado'));
    const conteudoDiv = document.getElementById('conteudo');
    
    if (chamado && chamado.nome) {
      // Define a classe e mensagem de acordo com o risco
      let corClasse = '', mensagemCor = '';
      if (chamado.risco === 'vermelho') { 
        corClasse = 'vermelho-bg'; 
        mensagemCor = '🔴 ATENÇÃO MÁXIMA!'; 
      }
      else if (chamado.risco === 'amarelo') { 
        corClasse = 'amarelo-bg'; 
        mensagemCor = '🟡 ATENÇÃO!'; 
      }
      else { 
        corClasse = 'verde-bg'; 
        mensagemCor = '🟢 ATENÇÃO!'; 
      }
      
      const consultorioTexto = chamado.consultorio || 'Consultório Médico';
      
      // Monta o HTML com as informações do paciente chamado
      conteudoDiv.innerHTML = `
        <div class="paciente-nome">${chamado.nome}</div>
        <div class="prioridade-badge ${corClasse}">${chamado.risco.toUpperCase()}</div>
        <div class="consultorio-info">🏥 ${consultorioTexto}</div>
        <div class="mensagem-aviso">${mensagemCor}<br>Dirija-se ao ${consultorioTexto}.</div>
      `;
      
      // Adiciona animação de piscar
      document.getElementById('painel').classList.add('chamado');
      // Remove a animação após 3 segundos
      setTimeout(() => document.getElementById('painel').classList.remove('chamado'), 3000);
    } else {
      // Nenhum paciente chamado no momento
      conteudoDiv.innerHTML = '<div class="aguardando">Aguardando chamada...</div>';
      document.getElementById('painel').classList.remove('chamado');
    }
  }
  
  // =================== ESCUTA MUDANÇAS NO localStorage (disparadas pelo médico) ===================
  window.addEventListener('storage', (event) => { 
    if (event.key === 'pacienteChamado') atualizarDisplay(); 
  });
  
  // =================== ATUALIZA A CADA 2 SEGUNDOS (fallback) ===================
  setInterval(atualizarDisplay, 2000);
  
  // =================== EXECUÇÃO INICIAL ===================
  atualizarDisplay();
</script>
</body>
</html>
